<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="heading-box">
      <h1>To-Do List</h1>
    </div>

    <div class="input-row">
      <input id="task-input" type="text" placeholder="Add a new task" />
      <button id="add-btn">Add</button>
    </div>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
